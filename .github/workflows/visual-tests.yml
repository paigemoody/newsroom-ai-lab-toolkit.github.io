name: Visual Regression Tests

on:
  pull_request:
    paths:
      - 'newsroom-ai-lab-toolkit-site/**'
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Regenerate visual baselines (Ubuntu-rendered)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsroom-ai-lab-toolkit-site/package-lock.json

      - name: Install dependencies
        working-directory: newsroom-ai-lab-toolkit-site
        run: npm ci

      - name: Install Playwright browsers
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright test tests/visual --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsroom-ai-lab-toolkit-site/tests/visual
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Regenerate visual regression baselines (Ubuntu-rendered)"
            git push
          fi

  playwright:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsroom-ai-lab-toolkit-site/package-lock.json

      - name: Install dependencies
        working-directory: newsroom-ai-lab-toolkit-site
        run: npm ci

      - name: Install Playwright browsers
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright test tests/visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: newsroom-ai-lab-toolkit-site/playwright-report/
          retention-days: 14
