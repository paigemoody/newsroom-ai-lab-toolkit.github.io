name: Visual Regression + Accessibility Tests

on:
  pull_request:
    paths:
      - 'newsroom-ai-lab-toolkit-site/**'

jobs:
  playwright:
    name: Playwright visual regression + axe a11y scan
    runs-on: ubuntu-latest
    # Run inside the same image the project's devcontainer uses (see
    # .devcontainer/devcontainer.json) so screenshots are rendered with the same OS,
    # fonts, and fontconfig as local development. Baselines are generated locally in
    # this container; comparing against a different OS (e.g. bare ubuntu-latest) causes
    # spurious diffs from font-rendering differences alone, not real regressions.
    container: mcr.microsoft.com/devcontainers/javascript-node:4-24-trixie
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsroom-ai-lab-toolkit-site/package-lock.json

      - name: Install dependencies
        working-directory: newsroom-ai-lab-toolkit-site
        run: npm ci

      - name: Install Playwright browsers
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright install --with-deps chromium

      - name: Run visual regression + accessibility tests
        working-directory: newsroom-ai-lab-toolkit-site
        # No path restriction - runs tests/visual (light-desktop, dark-desktop,
        # mobile-light projects) and tests/a11y (axe-core, serious/critical only) together.
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: newsroom-ai-lab-toolkit-site/playwright-report/
          retention-days: 14
