name: Visual Regression Tests

on:
  pull_request:
    paths:
      - 'newsroom-ai-lab-toolkit-site/**'

jobs:
  playwright:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsroom-ai-lab-toolkit-site/package-lock.json

      - name: Install dependencies
        working-directory: newsroom-ai-lab-toolkit-site
        run: npm ci

      - name: Install Playwright browsers
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: newsroom-ai-lab-toolkit-site
        run: npx playwright test tests/visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: newsroom-ai-lab-toolkit-site/playwright-report/
          retention-days: 14
